services:
  groomarr:
    build: .
    container_name: groomarr
    environment:
      # Required - qBittorrent Connection
      - QBITTORRENT_URL=http://qbittorrent:8080
      - QBITTORRENT_USERNAME=admin
      - QBITTORRENT_PASSWORD=adminadmin
      
      # Optional - API Server
      - API_PORT=8000
      - LOG_LEVEL=INFO
      # - LOG_FORMAT=json  # Use "json" for log aggregation systems
      
      # Optional - Rename Mode
      # Options: torrent_only, torrent_and_folder, torrent_folder_files, folder_only, files_only
      - RENAME_MODE=torrent_and_folder
      
      # Optional - Dry Run (test rules without making changes)
      # - DRY_RUN=true

      # Optional - UI API Key (protects /reload and config endpoints)
      # - UI_API_KEY=changeme
      
      # Optional - Timing (usually defaults are fine)
      - INITIAL_DELAY=2
      - MAX_RETRIES=10
      - RETRY_DELAY=3
    volumes:
      # Mount your rename_rules.yaml here
      - ./config:/config
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Uncomment if you need to connect to other containers
    # networks:
    #   - your_network

# Uncomment if you need to define networks
# networks:
#   your_network:
#     external: true
