name: CI

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '.github/**'
      - '.*'
      - 'README.md'

# Minimal default permissions for the GITHUB_TOKEN (principle of least privilege).
# Docker images are pushed to Docker Hub via username/token secrets, so the
# GITHUB_TOKEN itself only needs read access to the repository contents.
permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Tag
        id: set_docker_tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            BRANCH_NAME=$(echo ${{ github.ref }} | sed 's|refs/heads/||')
            echo "tag=$BRANCH_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: maksii/groomarr:${{ steps.set_docker_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max